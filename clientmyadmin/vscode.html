<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
		<style type="text/css">
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
			}
		</style>
	</head>
	<body>
		<div id="container" style="width: 100%; height: 100%"></div>
		<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"></script>
		<script type="module">
			require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs' } });
      const container = document.getElementById('container')

      const blob = await fetch(location.href).then(res => res.blob())
      const code = await blob.text()
      const type = blob.type

      require(["vs/editor/editor.main"], async function () {
        monaco.languages.typescript.javascriptDefaults.setEagerModelSync(true)
        const lang = 'typescript'

        const fileUri = monaco.Uri.parse(location.href);
        // const modelRef = await monaco.editor.createModelReference(fileUri)

        const model = new monaco.editor.createModel(code, lang, monaco.Uri.parse(location.href))
        const tsOp = monaco.languages.typescript.typescriptDefaults.getCompilerOptions()
        // monaco.languages.typescript.typescriptDefaults.addExtraLib('const arr = [];')

        tsOp.allowJs = true;
        tsOp.checkJs = true;
        monaco.languages.typescript.typescriptDefaults.setCompilerOptions(tsOp);

        monaco.languages.typescript.typescriptDefaults.setDiagnosticsOptions({
          noSemanticValidation: true,
          // noSyntaxValidation: true
        })

        globalThis.editor = monaco.editor.create(container, {
          model,
          theme: 'vs-dark',
          lineNumbers: 'on',
          wordWrap: 'off',
          overviewRulerLanes: 0,
          scrollbar: {
            vertical:"hidden",
            horizontal: "hidden",
            handleMouseWheel: true,
          },
          minimap: { enabled: false },
          language: "typescript",
        })

        globalThis.onresize = () => editor.layout()
      })
		</script>
	</body>
</html>
